name: Compilar y publicar APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      # La firma de depuración generada en GitHub Actions cambia en cada runner.
      # No se publica ningún APK sin la misma clave de la instalación original.
      - name: Recuperar firma original (obligatoria)
        shell: bash
        env:
          SKC_SIGNING_KEYSTORE_BASE64: ${{ secrets.SKC_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SKC_SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto SKC_SIGNING_KEYSTORE_BASE64. Sin la clave original, Android rechazará la actualización. Consulte COMPATIBILIDAD_APK.md."
            exit 1
          fi
          umask 077
          printf '%s' "$SKC_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/skc-original.keystore"
          test -s "$RUNNER_TEMP/skc-original.keystore"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android 36
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Compilar APK con la firma original
        env:
          SKC_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/skc-original.keystore
          SKC_SIGNING_STORE_PASSWORD: ${{ secrets.SKC_SIGNING_STORE_PASSWORD }}
          SKC_SIGNING_KEY_ALIAS: ${{ secrets.SKC_SIGNING_KEY_ALIAS }}
          SKC_SIGNING_KEY_PASSWORD: ${{ secrets.SKC_SIGNING_KEY_PASSWORD }}
        run: |
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Preparar y verificar APK firmado
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SKC-Facturas.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs SKC-Facturas.apk

      - name: Guardar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKC-Facturas-APK
          path: SKC-Facturas.apk

      - name: Obtener versión Android
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publicar APK compatible en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: SKC Facturas v${{ env.APP_VERSION }} - build ${{ github.run_number }}
          body: APK firmado con la clave original configurada como GitHub Secret. Es una compilación de pruebas con ID com.skcingenieria.facturas.pilot. Para actualizar una instalación anterior, la clave debe coincidir con su certificado.
          files: SKC-Facturas.apk
          make_latest: true
          generate_release_notes: false
