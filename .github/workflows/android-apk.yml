name: Compilar y publicar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK Android 36
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Compilar APK Debug
        run: |
          gradle --version
          gradle --no-daemon assembleDebug
      - name: Preparar APK para descarga directa
        run: cp app/build/outputs/apk/debug/app-debug.apk SKC-Facturas.apk
      - name: Guardar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKC-Facturas-APK
          path: SKC-Facturas.apk
      - name: Obtener versión Android
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: SKC Facturas v${{ env.APP_VERSION }} - build ${{ github.run_number }}
          body: APK de depuración instalable compilado automáticamente desde main. Para producción se necesita una firma release propia.
          files: SKC-Facturas.apk
          make_latest: true
          generate_release_notes: false
