<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="Descarga SKC Facturas para Android directamente desde GitHub.">
  <title>SKC Facturas · Descargar APK</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light; }
    *,*::before,*::after { box-sizing: border-box; }
    body { margin: 0; background: linear-gradient(125deg,#fff 0%,#f5f9ff 100%); color: #091831; }
    main { max-width: 1220px; min-height: 540px; margin: auto; padding: 96px 45px; display: flex; gap: 65px; justify-content: space-between; align-items: center; }
    .info { flex: 1 1 650px; }
    h1 { margin: 0 0 13px; font-size: clamp(38px,5.8vw,68px); letter-spacing: -2.2px; line-height: 1.1; font-weight: 750; }
    .subtitle { margin: 0 0 45px; font-size: clamp(17px,2.2vw,28px); line-height: 1.38; color: #4e5667; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
    .button { display: inline-flex; gap: 12px; align-items: center; justify-content: center; padding: 17px 23px; border-radius: 10px; font-size: 17px; font-weight: 650; text-decoration: none; line-height: 1.2; transition: transform .15s, box-shadow .15s; }
    .button:hover { transform: translateY(-2px); }
    .button:focus-visible { outline: 3px solid #6aa4ff; outline-offset: 3px; }
    .primary { background: #0c4bd7; border: 1px solid #0c4bd7; color: white; box-shadow: 0 5px 14px rgb(10 75 210 / 10%); }
    .primary:hover { background: #073eb9; box-shadow: 0 9px 18px rgb(10 75 210 / 17%); }
    .secondary { background: #fff; color: #111827; border: 1px solid #a5badc; }
    .secondary:hover { background: #f1f6ff; }
    .button svg { width: 23px; height: 23px; flex-shrink: 0; }
    .meta { margin-top: 24px; font-size: 15px; line-height: 1.9; color: #536071; }
    .meta p { margin: 0; }
    .app-icon { flex: 0 0 255px; display: flex; align-items: center; justify-content: center; }
    .app-icon svg { display: block; width: min(100%,255px); height: auto; filter: drop-shadow(0 10px 15px rgba(16,75,151,.08)); }
    @media(max-width:800px){ main{padding:70px 26px 50px;min-height:0;gap:25px;} .app-icon{flex-basis:160px;} .subtitle{margin-bottom:28px;} .button{padding:15px 17px;font-size:15px;} }
    @media(max-width:590px){ main{padding:48px 22px;gap:28px;flex-direction:column-reverse;align-items:flex-start;} .app-icon{flex:none;width:108px;align-self:flex-start;} h1{letter-spacing:-1.4px;} .subtitle{margin-bottom:26px;} .actions{align-items:stretch;} .button{width:100%;} }
    @media(prefers-reduced-motion:reduce){.button{transition:none;}}
  </style>
</head>
<body>
<main>
  <section class="info" aria-labelledby="title">
    <h1 id="title">SKC Facturas</h1>
    <p class="subtitle">Control de facturas, transferencias e inventario.</p>
    <div class="actions">
      <a class="button primary" id="apk" href="https://github.com/magalarza726-del/SKC-facturas/releases/latest/download/SKC-Facturas.apk" aria-label="Descargar la última APK de SKC Facturas">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M17.52 10.08l1.23-2.13-.86-.5-1.25 2.16a8.1 8.1 0 0 0-9.28 0L6.11 7.45l-.86.5 1.23 2.13A7.86 7.86 0 0 0 3 16.5V18h2v4h2v-4h10v4h2v-4h2v-1.5a7.86 7.86 0 0 0-3.48-6.42ZM8 14a.85.85 0 1 1 0-1.7A.85.85 0 0 1 8 14Zm8 0a.85.85 0 1 1 0-1.7A.85.85 0 0 1 16 14Z"/></svg>
        <span id="download-label">Descargar última APK</span>
      </a>
      <a class="button secondary" href="https://github.com/magalarza726-del/SKC-facturas" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.76-.24.76-.53v-2.05c-3.1.67-3.75-1.32-3.75-1.32-.51-1.29-1.25-1.63-1.25-1.63-1.02-.7.07-.69.07-.69 1.12.08 1.72 1.16 1.72 1.16.99 1.7 2.6 1.21 3.23.93.1-.72.39-1.21.7-1.49-2.48-.28-5.08-1.24-5.08-5.53 0-1.22.44-2.22 1.16-3.01-.12-.29-.5-1.43.11-2.97 0 0 .95-.3 3.08 1.15a10.8 10.8 0 0 1 5.6 0c2.14-1.45 3.08-1.15 3.08-1.15.62 1.54.24 2.68.12 2.97.72.79 1.16 1.79 1.16 3.01 0 4.3-2.6 5.24-5.09 5.52.4.35.75 1.03.75 2.08v3.13c0 .29.2.64.77.53A11.2 11.2 0 0 0 12 .8Z"/></svg>
        <span>Ver en GitHub</span>
      </a>
    </div>
    <div class="meta" aria-live="polite">
      <p id="updated">Última actualización: consultando GitHub…</p>
      <p><span id="size">Tamaño: —</span> <span aria-hidden="true">&nbsp; | &nbsp;</span> Android 8.0 o superior</p>
    </div>
  </section>
  <div class="app-icon" role="img" aria-label="Icono de SKC Facturas, recibo blanco sobre fondo azul">
    <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#0042b9"/><stop offset="1" stop-color="#138be8"/></linearGradient></defs>
      <rect width="256" height="256" rx="48" fill="url(#bg)"/>
      <path d="M20 237 245 20a48 48 0 0 1 11 30v158a48 48 0 0 1-48 48H49a48 48 0 0 1-29-19Z" fill="#043cab" opacity=".35"/>
      <path d="M72 45h112a11 11 0 0 1 11 11v148l-15-12-14 13-16-13-15 13-16-13-15 13-16-13-16 12V56a11 11 0 0 1 11-11Z" fill="white"/>
      <g stroke="#7291b6" stroke-width="8" stroke-linecap="round"><path d="M97 83h74M97 107h74M97 131h51"/></g>
      <g fill="#2376cf"><rect x="96" y="153" width="7" height="39"/><rect x="109" y="153" width="7" height="39"/><rect x="123" y="153" width="7" height="39"/><rect x="136" y="153" width="7" height="39"/><rect x="149" y="153" width="7" height="39"/><rect x="162" y="153" width="7" height="39"/><rect x="175" y="153" width="6" height="39"/></g>
    </svg>
  </div>
</main>
<script>
  // /latest/download funciona aun cuando la API de GitHub no responde.
  (async function () {
    const label = document.getElementById('download-label');
    const updated = document.getElementById('updated');
    const size = document.getElementById('size');
    try {
      const response = await fetch('https://api.github.com/repos/magalarza726-del/SKC-facturas/releases/latest',{headers:{Accept:'application/vnd.github+json'}});
      if (!response.ok) throw new Error('API no disponible');
      const release = await response.json();
      const apk = release.assets?.find(file => file.name === 'SKC-Facturas.apk');
      if (!apk) throw new Error('APK sin publicar');
      document.getElementById('apk').href = apk.browser_download_url;
      const version = /v(\d+\.\d+\.\d+)/i.exec(release.name || release.tag_name || '');
      if (version) label.textContent = 'Descargar APK (v' + version[1] + ')';
      const date = release.published_at || apk.created_at;
      if (date) updated.textContent = 'Última actualización: ' + new Intl.DateTimeFormat('es-EC',{day:'numeric',month:'long',year:'numeric',timeZone:'America/Guayaquil'}).format(new Date(date));
      size.textContent = 'Tamaño: ' + (apk.size / (1024 * 1024)).toFixed(1) + ' MB';
    } catch (error) {
      updated.textContent = 'Última versión disponible en GitHub Releases';
      size.textContent = 'Tamaño: consultar en GitHub';
    }
  })();
</script>
</body>
</html>
